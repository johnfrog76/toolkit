# Dependabot watches the three places this repository takes dependencies from.
# Minor and patch updates arrive as one pull request per ecosystem each week;
# a major update is not grouped, so it arrives on its own and is read on its own.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "pip"
    directory: "/agent"
    schedule:
      interval: "weekly"
    groups:
      pip-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"