<!-- Ported from aquarium-saver (MIT) by web/tools/port-aquarium.mjs.
     coral garden — salt water · paris room. Zero JavaScript; the saver's own clocks and its own
     reduced-motion resting pose. Do not edit by hand: re-port instead. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>coral garden</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d0b16; overflow: hidden; color-scheme: dark; }
      .lib { position: absolute; width: 0; height: 0; overflow: hidden; }
      svg.stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      /* STILL, with zero JavaScript: load this document as <src>#still and
         the body matches :target, freezing every clock at the saver's own
         resting pose -- the same pose its reduced-motion rule holds. The
         Lounge's Still control and a frozen grant both ride this fragment. */
      body:target, body:target * { animation: none !important; }
    </style>
    <style>
  /* ── The room ───────────────────────────────────────────────────────────
     A night room with one planted tank in it. Single-theme on purpose: a
     lamp over dark water is the whole point, and a light page would be a
     pet shop. Tokens are the saver engine's theme surface — the SVG below
     reads only these custom properties, never a literal.                  */
  :root {
    --room:        #0d0b16;   /* the wall, the night                      */
    --cabinet:     #171223;
    --cabinet-lip: #262038;
    --ink:         #d9d4e6;
    --muted:       #8f88a8;
    --accent:      #62e6ff;   /* family teal; here it is the clam's mantle */

    --lamp:        #ffe0b0;   /* the one light source                     */
    --lamp-hot:    #fff6e6;
    --fixture:     #1c1826;
    --fixture-edge:#2e2840;

    --water-top:   #123a4f;
    --water-deep:  #06141b;
    --glass:       rgba(190,232,242,.42);

    --sand-lit:    #c4ad84;
    --sand-shade:  #5a4a36;
    --soil:        #22180f;
    --gravel:      #4e4032;

    --leaf-hot:    #c2e884;   /* a tip in the cone                        */
    --leaf-lit:    #8fc45a;
    --leaf:        #4f8a34;
    --leaf-shade:  #2b5622;
    --leaf-deep:   #17301a;   /* a base in the shadow of the garden       */
    --leaf-rib:    #d8f0a8;

    --wood:        #4a3222;
    --wood-shade:  #241810;
    --wood-lit:    #8f6b49;
    --moss:        #4f7d38;
    --moss-shade:  #33552a;
    --moss-lit:    #86b35a;
    --rock:        #3a3449;
    --rock-lit:    #514a66;

    --coral-rose:  #d38472;  --coral-rose-dark:  #9c5647;  --polyp-rose:  #f5c2ae;
    --coral-ochre: #c9a55f;  --coral-ochre-dark: #8f7238;  --polyp-ochre: #f2dea3;
    --coral-plum:  #8f6faa;  --coral-plum-dark:  #5c4472;  --polyp-plum:  #d6c2ea;

    --shell:       #e6dccb;  --shell-shade: #9c8f7a;  --shell-rib: #b6a892;
    --mantle:      #3fd0ee;  --mantle-deep: #0f5468;  --mantle-hot: #a9f2ff;

    --discus:      #6cc8d4;  --discus-deep: #3a8a98;  --discus-line: #b8603c;  --discus-eye: #c8342c;
    --anemone-tip: #ffd1dc;
    --hp-leaf:     #2f4a2e;   /* a houseplant in the dark of the room  */
    --hp-vein:     #3f6a3a;
    --hp-pot:      #3a2e26;
    --hp-rim:      #4a3b30;
    --clown:       #f08a3c;  --clown-deep:  #b85a1c;  --clown-bar:   #fbf6ee;
  }

  html, body { margin: 0; background: var(--room); color: var(--ink); }
  body {
    font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    font-size: 16px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1180px; margin: 0 auto; padding: 40px 24px 72px; }

  header { display: grid; grid-template-columns: minmax(0, 62ch) 1fr; gap: 32px 56px; align-items: end; margin-bottom: 28px; }
  .eyebrow { font-family: "IBM Plex Mono", Consolas, monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  h1 { font-size: 30px; font-weight: 500; letter-spacing: -.01em; line-height: 1.15; margin: 0 0 14px; text-wrap: balance; }
  header p { margin: 0; color: var(--ink); max-width: 62ch; }
  .mechanisms { font-family: "IBM Plex Mono", Consolas, monospace; font-size: 12.5px; line-height: 1.7; color: var(--muted); }
  .mechanisms b { color: var(--ink); font-weight: 400; }

  /* the tank is the hero: a 16:9 stage, exactly the deck's frame */
  .stage { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 4px; overflow: hidden; }

  .note { margin: 18px 0 44px; color: var(--muted); font-size: 14px; max-width: 70ch; }

  h2 { font-size: 13px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 18px; }
  .plates { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 22px; align-items: start; }
  @media (max-width: 760px) { .plates { grid-template-columns: repeat(2, minmax(0, 1fr)); } header { grid-template-columns: 1fr; } }
  @media (max-width: 460px) { .plates { grid-template-columns: 1fr; } }
  .plates-rooms { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 760px) { .plates-rooms { grid-template-columns: 1fr; } }
  .plate svg { width: 100%; height: auto; display: block; border-radius: 4px; }
  .plate figcaption { margin-top: 10px; font-family: "IBM Plex Mono", Consolas, monospace; font-size: 12.5px; line-height: 1.6; color: var(--muted); }
  .plate figcaption b { color: var(--ink); font-weight: 400; display: block; }
  figure { margin: 0; }

  footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--cabinet-lip); font-family: "IBM Plex Mono", Consolas, monospace; font-size: 12px; color: var(--muted); line-height: 1.7; max-width: 80ch; }
  footer code { color: var(--ink); }
  .nav { font-family: "IBM Plex Mono", Consolas, monospace; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 30px; display: flex; gap: 22px; }
  .nav a { color: var(--muted); text-decoration: none; } .nav a:hover, .nav a[aria-current] { color: var(--accent); }

  /* ── The room clock ─────────────────────────────────────────────────────
     Every period is seven seconds or longer, every keyframe list is
     uneven, and every instance starts mid-cycle through a negative
     --phase. Nothing here fires on an event; the room runs on its own.
     Static pose = resting pose, so reduced-motion shows a tank at rest.

     Placement transforms live on a wrapping <g>; an animated element never
     carries a transform attribute, because the animation would replace it. */
  .lamp-breath  { animation: lamp-breath 41s ease-in-out var(--phase, 0s) infinite; }
  .surface      { animation: surface-drift 19s linear infinite; }
  .caustic-a    { animation: caustic-a 23s linear infinite; }
  .caustic-b    { animation: caustic-b 31s ease-in-out infinite; }
  /* the current: plants and corals bend like trees — trunk a little, crown more, tips most and last */
  .sway-trunk   { animation: sway 9.5s ease-in-out var(--sway, 0s) infinite; transform-box: fill-box; transform-origin: 50% 100%; --deg: 2.2deg; }
  .sway-crown   { animation: sway 9.5s ease-in-out calc(var(--sway, 0s) - .7s) infinite; transform-box: fill-box; transform-origin: 50% 100%; --deg: 4deg; }
  .sway-tips    { animation: sway 9.5s ease-in-out calc(var(--sway, 0s) - 1.4s) infinite; transform-box: fill-box; transform-origin: 50% 100%; --deg: 3.5deg; }
  /* generated corals: every fork is a joint (origin baked inline by the generator) */
  .sway-d0      { animation: sway 9.5s ease-in-out var(--sway, 0s) infinite; transform-box: fill-box; --deg: 1.2deg; }
  .sway-d1      { animation: sway 9.5s ease-in-out calc(var(--sway, 0s) - .25s) infinite; transform-box: fill-box; --deg: 1.6deg; }
  .sway-d2      { animation: sway 9.5s ease-in-out calc(var(--sway, 0s) - .5s) infinite; transform-box: fill-box; --deg: 2deg; }
  .sway-d3      { animation: sway 9.5s ease-in-out calc(var(--sway, 0s) - .8s) infinite; transform-box: fill-box; --deg: 2.6deg; }
  .sway-d4      { animation: sway 9.5s ease-in-out calc(var(--sway, 0s) - 1.1s) infinite; transform-box: fill-box; --deg: 3deg; }
  /* eel grass: a ribbon pivots on its base and trails at the top */
  .ribbon       { animation: sway 9.5s ease-in-out calc(var(--sway, 0s) + var(--lag, 0s)) infinite; transform-box: fill-box; transform-origin: 0 100%; }
  .pulse        { animation: coral-pulse var(--period, 11s) ease-in-out var(--phase, 0s) infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .mantle       { animation: mantle-breathe var(--period, 9.3s) ease-in-out var(--phase, 0s) infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .guts         { animation: guts var(--period, 9.3s) ease-in-out var(--phase, 0s) infinite; }
  .clam-glow    { animation: clam-glow var(--period, 9.3s) ease-in-out var(--phase, 0s) infinite; }
  .hang         { animation: hang 7.7s ease-in-out var(--phase, 0s) infinite; }
  .pectoral     { animation: pectoral 2.6s ease-in-out var(--phase, 0s) infinite; transform-box: fill-box; transform-origin: 0% 50%; }
  .tail-ripple  { animation: tail-ripple 3.1s ease-in-out var(--phase, 0s) infinite; transform-box: fill-box; transform-origin: 0% 50%; }
  .drift        { animation: discus-drift 43s ease-in-out var(--phase, 0s) infinite; }
  .weave        { animation: clown-weave 23s ease-in-out var(--phase, 0s) infinite; }
  .face         { animation: clown-face 23s ease-in-out var(--phase, 0s) infinite; }
  .tail-wag     { animation: tail-wag 1.9s ease-in-out var(--phase, 0s) infinite; transform-box: fill-box; transform-origin: 0% 50%; }
  .school       { animation: school-drift 37s ease-in-out var(--phase, 0s) infinite; }
  .school-face  { animation: school-face 37s ease-in-out var(--phase, 0s) infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  /* the clownfish leaves its anemone, pauses, and comes home; it turns only while paused */
  .home         { animation: clown-home 29s ease-in-out var(--phase, 0s) infinite; }
  .home-face    { animation: clown-home-face 29s ease-in-out var(--phase, 0s) infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  .antenna      { animation: twitch 5.7s ease-in-out var(--phase, 0s) infinite; transform-box: fill-box; transform-origin: 100% 100%; }
  /* pearling: a bubble grows on a leaf tip for most of its cycle, lets go, and rises to the surface */
  .pearl        { opacity: 0; animation: pearl var(--period, 37s) linear var(--phase, 0s) infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  .bubble       { opacity: 0; animation: rise var(--d, 6.5s) ease-in var(--p, 0s) infinite; }

  @keyframes lamp-breath   { 0%,100% { opacity: 1 } 47% { opacity: .93 } 71% { opacity: .97 } }
  @keyframes surface-drift { to { transform: translateX(-120px) } }
  @keyframes caustic-a     { to { transform: translateX(-80px) } }
  @keyframes caustic-b     { 0%,100% { transform: translate(0,0) } 44% { transform: translate(-26px, 9px) } 70% { transform: translate(-12px, 14px) } }
  /* one direction the whole tank leans; each plant meets the beat a little late */
  @keyframes sway          { 0%,100% { transform: rotate(0deg) } 38% { transform: rotate(var(--deg)) } 58% { transform: rotate(calc(var(--deg) * .68)) } }
  /* a coral's polyps swell, and it spends more than half its cycle between beats */
  @keyframes coral-pulse   { 0%,32% { transform: scale(1,1) } 50% { transform: scale(1.02,1.03) } 60% { transform: scale(1.015,1.025) } 82%,100% { transform: scale(1,1) } }
  /* the clam: open, hold, then a long held exhale */
  @keyframes mantle-breathe{ 0%,62%,100% { transform: scale(1,1) } 24%,44% { transform: scale(1.04,1.09) } }
  @keyframes guts          { 0%,62%,100% { opacity: .6 } 24%,44% { opacity: .95 } }
  @keyframes clam-glow     { 0%,62%,100% { opacity: .28 } 24%,44% { opacity: .5 } }
  @keyframes hang          { 0%,100% { transform: translateY(0) } 36% { transform: translateY(-3px) } 71% { transform: translateY(2px) } }
  @keyframes pectoral      { 0%,100% { transform: scaleX(1) } 50% { transform: scaleX(.55) } }
  @keyframes tail-ripple   { 0%,100% { transform: skewY(0deg) } 50% { transform: skewY(4deg) } }
  /* a drift with a pause it has reached */
  @keyframes discus-drift  { 0%,18% { transform: translateX(0) } 42%,66% { transform: translateX(-64px) } 88%,100% { transform: translateX(0) } }
  @keyframes clown-weave   { 0% { transform: translate(0,0) } 22%,34% { transform: translate(-46px,-26px) } 55%,68% { transform: translate(34px,-48px) } 100% { transform: translate(0,0) } }
  /* the clownfish only turns during a pause */
  @keyframes clown-face    { 0%,28% { transform: scaleX(1) } 34%,62% { transform: scaleX(-1) } 68%,100% { transform: scaleX(1) } }
  @keyframes tail-wag      { 0%,100% { transform: rotate(0deg) } 50% { transform: rotate(7deg) } }
  @keyframes school-drift  { 0%,12% { transform: translate(0,0) } 38%,55% { transform: translate(-150px,-34px) } 80%,100% { transform: translate(0,0) } }
  @keyframes school-face   { 0%,3% { transform: scaleX(-1) } 8%,44% { transform: scaleX(1) } 49%,100% { transform: scaleX(-1) } }
  @keyframes clown-home      { 0%,30% { transform: translate(0,0) } 42%,50% { transform: translate(-48px,-60px) } 62%,70% { transform: translate(38px,-78px) } 84%,100% { transform: translate(0,0) } }
  @keyframes clown-home-face { 0%,44% { transform: scaleX(1) } 48%,64% { transform: scaleX(-1) } 68%,100% { transform: scaleX(1) } }
  @keyframes twitch          { 0%,70%,100% { transform: rotate(0deg) } 78% { transform: rotate(-7deg) } 86% { transform: rotate(3deg) } }
  @keyframes pearl         { 0% { transform: translateY(0) scale(.15); opacity: 0 } 5% { opacity: .9 } 70% { transform: translateY(0) scale(1); opacity: .9 } 73% { transform: translateY(-3px) scale(1) } 97% { transform: translateY(var(--rise, -60px)) scale(1.15); opacity: .55 } 100% { transform: translateY(var(--rise, -60px)) scale(1.15); opacity: 0 } }
  @keyframes rise          { 0% { transform: translate(0,0); opacity: 0 } 7% { opacity: .85 } 50% { transform: translate(var(--wx, 2px), calc(var(--rise, -330px) / 2)) } 94% { opacity: .55 } 100% { transform: translate(0, var(--rise, -330px)); opacity: 0 } }

  @media (prefers-reduced-motion: reduce) {
    svg * { animation: none !important; }
    .bubble { opacity: 0 !important; }
  }
</style>
  </head>
  <body id="still">
    <svg class="lib" aria-hidden="true">
    <defs>
      <!-- ── gradients, all in bounding-box units so any plate can reuse them ── -->
      <linearGradient id="g-water" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--water-top)"/>
        <stop offset="1" stop-color="var(--water-deep)"/>
      </linearGradient>
      <linearGradient id="g-cone" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"    stop-color="var(--lamp)" stop-opacity=".22"/>
        <stop offset=".135" stop-color="var(--lamp)" stop-opacity=".08"/>
        <stop offset=".137" stop-color="var(--lamp)" stop-opacity=".32"/>
        <stop offset=".86"  stop-color="var(--lamp)" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="g-ray" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--lamp-hot)" stop-opacity=".16"/>
        <stop offset="1" stop-color="var(--lamp-hot)" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="g-surface-glow">
        <stop offset="0" stop-color="var(--lamp-hot)" stop-opacity=".55"/>
        <stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="g-wall-glow">
        <stop offset="0" stop-color="var(--lamp)" stop-opacity=".09"/>
        <stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="g-fixture" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--fixture-edge)"/>
        <stop offset="1" stop-color="var(--fixture)"/>
      </linearGradient>
      <radialGradient id="g-lens-halo">
        <stop offset="0" stop-color="var(--lamp-hot)" stop-opacity=".9"/>
        <stop offset=".5" stop-color="var(--lamp)" stop-opacity=".35"/>
        <stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="g-sand" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--sand-lit)"/>
        <stop offset=".55" stop-color="var(--sand-shade)"/>
        <stop offset="1" stop-color="var(--soil)"/>
      </linearGradient>
      <radialGradient id="g-caustic-fade">
        <stop offset="0" stop-color="#fff"/>
        <stop offset=".55" stop-color="#fff" stop-opacity=".5"/>
        <stop offset="1" stop-color="#000"/>
      </radialGradient>
      <!-- leaves: lit at the tip, shaded at the base — the lamp is above, the garden shades itself -->
      <linearGradient id="g-leaf-lit" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--leaf-hot)"/>
        <stop offset=".5" stop-color="var(--leaf-lit)"/>
        <stop offset="1" stop-color="var(--leaf)"/>
      </linearGradient>
      <linearGradient id="g-leaf" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--leaf-lit)"/>
        <stop offset=".55" stop-color="var(--leaf)"/>
        <stop offset="1" stop-color="var(--leaf-shade)"/>
      </linearGradient>
      <linearGradient id="g-leaf-shade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--leaf)"/>
        <stop offset="1" stop-color="var(--leaf-deep)"/>
      </linearGradient>
      <linearGradient id="g-wood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--wood)"/>
        <stop offset="1" stop-color="var(--wood-shade)"/>
      </linearGradient>
      <linearGradient id="g-rock" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--rock-lit)"/>
        <stop offset="1" stop-color="var(--rock)"/>
      </linearGradient>
      <linearGradient id="g-shell" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--shell)"/>
        <stop offset="1" stop-color="var(--shell-shade)"/>
      </linearGradient>
      <radialGradient id="g-mantle" cx=".5" cy=".3" r=".75">
        <stop offset="0" stop-color="var(--mantle-hot)"/>
        <stop offset=".45" stop-color="var(--mantle)"/>
        <stop offset="1" stop-color="var(--mantle-deep)"/>
      </radialGradient>
      <radialGradient id="g-guts">
        <stop offset="0" stop-color="#e6ffff" stop-opacity=".95"/>
        <stop offset=".45" stop-color="var(--mantle-hot)" stop-opacity=".5"/>
        <stop offset="1" stop-color="var(--mantle)" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="g-clam-glow">
        <stop offset="0" stop-color="var(--mantle)" stop-opacity="1"/>
        <stop offset="1" stop-color="var(--mantle)" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="g-discus" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--discus)"/>
        <stop offset="1" stop-color="var(--discus-deep)"/>
      </linearGradient>
      <linearGradient id="g-clown" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--clown)"/>
        <stop offset="1" stop-color="var(--clown-deep)"/>
      </linearGradient>
      <!-- ── the reef's light: cool white, an actinic edge, whiter sand ── -->
      <linearGradient id="g-reef-water" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0b3550"/>
        <stop offset="1" stop-color="#03101c"/>
      </linearGradient>
      <linearGradient id="g-reef-cone" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"    stop-color="#cfe9ff" stop-opacity=".2"/>
        <stop offset=".135" stop-color="#cfe9ff" stop-opacity=".07"/>
        <stop offset=".137" stop-color="#cfe9ff" stop-opacity=".3"/>
        <stop offset=".86"  stop-color="#8fb4ff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="g-reef-ray" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#eaf6ff" stop-opacity=".14"/>
        <stop offset="1" stop-color="#eaf6ff" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="g-reef-halo">
        <stop offset="0" stop-color="#f4faff" stop-opacity=".9"/>
        <stop offset=".5" stop-color="#cfe9ff" stop-opacity=".35"/>
        <stop offset="1" stop-color="#8fb4ff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="g-reef-surface">
        <stop offset="0" stop-color="#f4faff" stop-opacity=".5"/>
        <stop offset="1" stop-color="#cfe9ff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="g-reef-wall">
        <stop offset="0" stop-color="#8fb4ff" stop-opacity=".07"/>
        <stop offset="1" stop-color="#8fb4ff" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="g-reef-sand" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d9d3c4"/>
        <stop offset=".55" stop-color="#6d6a60"/>
        <stop offset="1" stop-color="#26241f"/>
      </linearGradient>
      <linearGradient id="g-anemone" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f2b4c0"/>
        <stop offset=".6" stop-color="#d9a08a"/>
        <stop offset="1" stop-color="#9c7462"/>
      </linearGradient>
      <linearGradient id="g-anemone-front" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d99aa8"/>
        <stop offset=".6" stop-color="#b8806e"/>
        <stop offset="1" stop-color="#7c5a4e"/>
